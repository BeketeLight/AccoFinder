<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
    width="24"
    height="24"
    viewBox="0 0 24 24"
    version="1.1"
    xmlns="http://www.w3.org/2000/svg">

    <!-- Black rounded background -->
    <rect
        x="2"
        y="3"
        width="20"
        height="18"
        rx="2.5"
        ry="2.5"
        fill="#000000"/>

    <!-- White X -->
    <line
        x1="8"
        y1="8"
        x2="16"
        y2="16"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"/>

    <line
        x1="16"
        y1="8"
        x2="8"
        y2="16"
        stroke="#ffffff"
        stroke-width="2.2"
        stroke-linecap="round"/>

</svg>